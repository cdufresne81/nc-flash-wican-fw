# CI: build the obd_pro firmware image (ESP-IDF v5.5.3 / esp32s3) and upload the
# flashable artifacts. On a v* tag, also publish a GitHub Release with auto-generated
# notes and the firmware attached. Uses the committed sdkconfig as-is (no set-target).
# First-cut; refine later (matrix/other HW variants, signed images, etc.).
name: Build firmware

on:
  workflow_dispatch:
  push:
    branches:
      - wican-pro
    tags:
      - 'v*'
  pull_request:

jobs:
  # Everything that needs neither a toolchain nor hardware. Runs in parallel with
  # the build so a stale generated file or a doc citing a deleted symbol fails in
  # seconds instead of after a full ESP-IDF build.
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Dangling getElementById targets, inline handlers calling functions that
      # no longer exist, and a stale src/homepage.html (build_web.py --check).
      - name: Web UI lint + generated-file freshness
        run: python tools/lint_web.py

      # docs/internals/ citing symbols or files that have since been renamed or
      # deleted. Dated snapshot docs are exempt by design.
      - name: Docs match the code
        run: python tools/check_docs.py

      # Pure-logic tests for main.js, run in a vm sandbox with DOM stubs.
      - name: Host tests
        run: node --test tools/webtest/*.test.mjs

      # C host tests: the csv_logger bring-up chain (RTC crash guard, manual-override
      # lifetime, logging gate). Plain cc, no toolchain, seconds to run -- see
      # tools/hosttest/run.sh for why that logic is separable at all.
      - name: Host tests (C)
        run: bash tools/hosttest/run.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (ESP-IDF v5.5.3, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: '.'
          # dependencies.lock is untracked (see .gitignore) and regenerated fresh in-container,
          # which avoids the Windows-CRLF vs Linux-LF component_hash clash on the git-sourced
          # ch34x driver (still pinned to an immutable commit in main/idf_component.yml). Nothing
          # mutates the working tree here, so tagged builds produce clean (non-dirty) artifacts.
          #
          # Redirected rather than piped: a pipe would make the step's exit status
          # tee's, silently turning a failed build into a green one. The log is
          # replayed by the next step and parsed by the budget gate after that.
          command: 'idf.py build > build_output.log 2>&1'

      - name: Build log
        if: always()
        run: tail -n 200 build_output.log || echo "(no build log produced)"

      # Warnings in our own code and app-image size, both ratcheted against
      # tools/build_baseline.json. Growth is allowed but must be declared.
      - name: Build budget (warnings + image size)
        run: python tools/check_build_budget.py --log build_output.log

      - name: Stage flashable artifacts
        run: |
          set -e
          mkdir -p dist
          # App image (also the OTA image: POST to /upload/ota.bin) + ota_data + the
          # bootloader/partition-table for a full serial flash + the offsets file.
          cp build/*.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/flasher_args.json dist/
          echo "Staged:"; ls -l dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wican-obd_pro-firmware
          if-no-files-found: error
          retention-days: 14
          path: dist/**

  release:
    needs: [build, checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: wican-obd_pro-firmware
          path: dist

      - name: Publish GitHub Release (auto-generated notes + firmware)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true        # notes from merged PRs/commits since the last tag
          fail_on_unmatched_files: true
          files: dist/*
